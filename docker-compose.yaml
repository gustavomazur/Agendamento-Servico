services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - envs/.env
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - agendamento_servico

  app:
    build: .
    restart: on-failure
    env_file:
      - envs/.env
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_HOSTNAME: db
      DATABASE_PORT: 5432
      SERVER_PORT: 8080
    networks:
      - agendamento_servico

volumes:
  postgres-data:

networks:
  agendamento_servico:
    driver: bridge